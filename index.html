<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Nerd Sistem</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ana-kutu">

        <div class="resim-kutusu">
            <img src="https://i.pinimg.com/originals/b8/9b/45/b89b456a5c24b5eefcd150d3c2a035c3.gif" alt="Nerd Sistem Görseli">
        </div>

        <div class="form-kutusu">
            <h2>Nerd Sisteme Giriş</h2>
            
            <form id="loginForm">
                <label for="name">İsim</label>
                <input type="name" id="name" placeholder="Örneğin: Monica Belluci" required>

                <label for="password">Şifre</label>
                <input type="password" id="password" placeholder="Örneğin: 123" required>

                <button type="submit">Giriş Yap</button>
            </form>
        </div>

    </div>
    <script src="app.js"></script>

    <link rel="icon" type="image/x-icon" href="favicon.png">

</body>
</html>
