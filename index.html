<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Calisma Programi</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ana-kutu">

        <div class="resim-kutusu">
            <img src="starting.gif" alt="Nerd Sistem Görseli">
        </div>

        <div class="form-kutusu">
            <h2>Çalışma Sistemine Giriş</h2>
            
            <form id="loginForm">
                <label for="name">Kullanıcı Adı</label>
                <input type="name" id="name" placeholder="Örneğin: Dean" required>

                <label for="password">Şifre</label>
                <input type="password" id="password" placeholder="Örneğin: Winchester" required>

                <button type="submit">Giriş Yap</button>
            </form>
        </div>

    </div>
    <script src="app.js"></script>

    <link rel="icon" type="image/x-icon" href="favicon.png">

</body>
</html>
