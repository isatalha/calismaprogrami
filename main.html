<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İnteraktif Onay Kutusu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .checkmark-path {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      transition: stroke-dashoffset 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:checked + .checkbox-box .checkmark-path {
      stroke-dashoffset: 0;
    }

    .checkbox-box {
      transition: all 0.22s ease-in-out;
    }

    /* Hafif tıklama / basılma tepkisi */
    .checkbox-container:active .checkbox-box {
      transform: scale(0.92);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

  <main class="flex flex-col items-center gap-6">
    <!-- Etkileşimli Tik Alanı -->
    <label class="checkbox-container relative flex items-center justify-center cursor-pointer select-none group p-4">
      <!-- Gizli standart checkbox -->
      <input type="checkbox" id="tickBox" class="peer sr-only" />

      <!-- Özel Tasarım Kutucuk -->
      <div class="checkbox-box w-20 h-20 sm:w-24 sm:h-24 rounded-2xl border-4 border-slate-700 bg-slate-800/80 shadow-2xl flex items-center justify-center group-hover:border-slate-500 peer-checked:bg-emerald-500 peer-checked:border-emerald-400 peer-focus-visible:ring-4 peer-focus-visible:ring-emerald-500/40 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-slate-900">
        <!-- SVG Tik İkonu -->
        <svg 
          class="w-12 h-12 sm:w-14 sm:h-14 text-white pointer-events-none drop-shadow-sm" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
        >
          <path class="checkmark-path" d="M5 13l4 4L19 7" />
        </svg>
      </div>
    </label>

    <div class="text-center">
      <span id="statusText" class="text-sm font-medium tracking-wide uppercase text-slate-400 transition-colors duration-200">
        İşaretsiz (Tıkla)
      </span>
    </div>
  </main>

  <script>
    const tickBox = document.getElementById('tickBox');
    const statusText = document.getElementById('statusText');

    tickBox.addEventListener('change', () => {
      if (tickBox.checked) {
        statusText.textContent = 'İşaretlendi ✓';
        statusText.className = 'text-sm font-semibold tracking-wide uppercase text-emerald-400 transition-colors duration-200';
      } else {
        statusText.textContent = 'İşaretsiz (Tıkla)';
        statusText.className = 'text-sm font-medium tracking-wide uppercase text-slate-400 transition-colors duration-200';
      }
    });
  </script>
</body>
</html>
