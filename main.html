<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İnteraktif Onay Kutusu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .checkmark-path {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      transition: stroke-dashoffset 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:checked + .checkbox-box .checkmark-path {
      stroke-dashoffset: 0;
    }

    .checkbox-box {
      transition: all 0.22s ease-in-out;
    }

    /* Hafif tıklama / basılma tepkisi */
    .checkbox-container:active .checkbox-box {
      transform: scale(0.92);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

  <main class="flex flex-col items-center gap-6">
    <!-- Etkileşimli Tik Alanı -->
    <label class="checkbox-container relative flex items-center justify-center cursor-pointer select-none group p-4">
      <!-- Gizli standart checkbox -->
      <input type="checkbox" id="tickBox" class="peer sr-only" />

      <!-- Özel Tasarım Kutucuk -->
      <div class="checkbox-box w-20 h-20 sm:w-24 sm:h-24 rounded-2xl border-4 border-slate-700 bg-slate-800/80 shadow-2xl flex items-center justify-center group-hover:border-slate-500 peer-checked:bg-emerald-500 peer-checked:border-emerald-400 peer-focus-visible:ring-4 peer-focus-visible:ring-emerald-500/40 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-slate-900">
        <!-- SVG Tik İkonu -->
        <svg 
          class="w-12 h-12 sm:w-14 sm:h-14 text-white pointer-events-none drop-shadow-sm" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
        >
          <path class="checkmark-path" d="M5 13l4 4L19 7" />
        </svg>
      </div>
    </label>

    <div class="text-center flex flex-col items-center">
      <span id="statusText" class="text-sm font-medium tracking-wide uppercase text-slate-400 transition-colors duration-200">
        Firebase Bağlanıyor...
      </span>
      <span id="syncBadge" class="text-xs text-slate-500 mt-2 font-mono transition-colors">
        ● Firebase başlatılıyor
      </span>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3fqlnY7FW0pWHZeHeUnv5uokv9iZyWCw",
      authDomain: "deneme-emaya.firebaseapp.com",
      projectId: "deneme-emaya",
      storageBucket: "deneme-emaya.firebasestorage.app",
      messagingSenderId: "503994031405",
      appId: "1:503994031405:web:8ac6b8ee25f90ec4be47a4",
      measurementId: "G-VSEHJ2SW6Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const tickBox = document.getElementById('tickBox');
    const statusText = document.getElementById('statusText');
    const syncBadge = document.getElementById('syncBadge');

    const docRef = doc(db, "settings", "checkboxState");

    function updateUI(isChecked) {
      tickBox.checked = isChecked;
      if (isChecked) {
        statusText.textContent = 'İşaretlendi ✓';
        statusText.className = 'text-sm font-semibold tracking-wide uppercase text-emerald-400 transition-colors duration-200';
      } else {
        statusText.textContent = 'İşaretsiz (Tıkla)';
        statusText.className = 'text-sm font-medium tracking-wide uppercase text-slate-400 transition-colors duration-200';
      }
    }

    // Başlangıçta kutuyu geçici olarak devre dışı bırakıp Firebase'i dinleyelim
    tickBox.disabled = true;

    // Gerçek zamanlı (Real-time) dinleme
    onSnapshot(docRef, (docSnap) => {
      tickBox.disabled = false;
      if (docSnap.exists()) {
        const data = docSnap.data();
        updateUI(Boolean(data.checked));
      } else {
        updateUI(false);
      }
      if (syncBadge) {
        syncBadge.textContent = '● Firebase Canlı Bağlı';
        syncBadge.className = 'text-xs text-emerald-400 mt-2 font-mono';
      }
    }, (error) => {
      console.error("Firebase Firestore Hatası:", error);
      tickBox.disabled = false;
      statusText.textContent = 'Firebase Bağlantı Hatası!';
      statusText.className = 'text-sm font-semibold tracking-wide uppercase text-rose-400';
      if (syncBadge) {
        syncBadge.textContent = '● Firestore izin / kural hatası (' + (error.code || 'hata') + ')';
        syncBadge.className = 'text-xs text-rose-400 mt-2 font-mono';
      }
    });

    // Kullanıcı kutuya tıkladığında Firebase Firestore'a yazma
    tickBox.addEventListener('change', async () => {
      const isChecked = tickBox.checked;
      updateUI(isChecked);
      if (syncBadge) syncBadge.textContent = 'Kaydediliyor...';

      try {
        await setDoc(docRef, {
          checked: isChecked,
          updatedAt: new Date().toISOString()
        }, { merge: true });
        if (syncBadge) {
          syncBadge.textContent = '● Firebase Canlı Bağlı';
          syncBadge.className = 'text-xs text-emerald-400 mt-2 font-mono';
        }
      } catch (error) {
        console.error("Firestore kaydetme hatası:", error);
        alert("Firestore kaydetme hatası: " + error.message);
        tickBox.checked = !isChecked;
        updateUI(!isChecked);
      }
    });
  </script>
</body>
</html>
